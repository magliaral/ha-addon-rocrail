name: Wrapper Release

# Releases the *wrapper* (this repo's Dockerfile + run.sh + config.yaml).
# Does NOT build or publish container images: each HA user's Supervisor
# builds the container locally. The Rocrail server is downloaded at
# runtime by run.sh, not by CI. See LICENSE / README for the rationale.

on:
  push:
    branches: [main]
    paths:
      - 'rocrail/**'
      - '.github/workflows/build.yml'
      - '.github/scripts/**'
  workflow_dispatch:
    inputs:
      force:
        description: 'Force a release even without changes'
        type: boolean
        default: false

env:
  ADDON_SLUG: rocrail

permissions:
  contents: write       # commit version bump + push v-tag
  packages: write       # let prune-old-patches.py delete legacy GHCR
                        # image versions from the retired v1.x line

concurrency:
  group: wrapper-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0   # bumper needs full history + all v* tags

      - name: Compute SemVer bump from Conventional Commits
        id: bump
        run: |
          set -euo pipefail
          VERSION=$(awk -F'"' '/^version:/ {print $2; exit}' rocrail/config.yaml)
          # Strip legacy suffixes if present (-rev-N, -build.N, -YYYY.MM.DD)
          BASE_SEMVER=$(echo "${VERSION}" | sed -E 's/-(rev-[0-9]+|build\.[0-9]+|[0-9]{4}\.[0-9]{2}\.[0-9]{2})$//')
          echo "Config base SemVer: ${BASE_SEMVER}"

          if LAST_TAG=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null); then
            echo "Last release tag: ${LAST_TAG}"
            python3 .github/scripts/bump-semver.py \
              --base-semver "${BASE_SEMVER}" \
              --range "${LAST_TAG}..HEAD" >> "$GITHUB_OUTPUT"
            echo "first_tag=false" >> "$GITHUB_OUTPUT"
          else
            echo "No v* tag yet - first release, no bump"
            python3 .github/scripts/bump-semver.py \
              --base-semver "${BASE_SEMVER}" >> "$GITHUB_OUTPUT"
            echo "first_tag=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Decide release & resolve version
        id: gate
        env:
          SEMVER:    ${{ steps.bump.outputs.semver }}
          BUMPED:    ${{ steps.bump.outputs.bumped }}
          FIRST_TAG: ${{ steps.bump.outputs.first_tag }}
          FORCE:     ${{ github.event.inputs.force }}
          EVENT:     ${{ github.event_name }}
        run: |
          set -euo pipefail

          # Release if: CC-bump, force, or any push event matching the
          # filter (push without CC-bump -> auto-patch).
          if [ "${BUMPED}" = "true" ] || [ "${FORCE}" = "true" ] || [ "${EVENT}" = "push" ]; then
            RELEASE=true
          else
            RELEASE=false
          fi

          if [ "${RELEASE}" != "true" ]; then
            NEW_VERSION="${SEMVER}"
          elif [ "${FIRST_TAG}" = "true" ] || [ "${BUMPED}" = "true" ]; then
            NEW_VERSION="${SEMVER}"
          else
            MAJOR=$(echo "${SEMVER}" | cut -d. -f1)
            MINOR=$(echo "${SEMVER}" | cut -d. -f2)
            PATCH=$(echo "${SEMVER}" | cut -d. -f3)
            NEW_VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))"
            echo "Auto-patch ${SEMVER} -> ${NEW_VERSION}"
          fi

          # Idempotency guard: if a second workflow run targets the same
          # commit (e.g. duplicate push event, force-push, concurrent
          # dispatch), the first run will have already pushed v<version>
          # to origin. Bail silently here so we don't try to re-commit
          # or re-tag — that always fails with a non-fast-forward push.
          if [ "${RELEASE}" = "true" ]; then
            TAG="v${NEW_VERSION}"
            if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
              echo "::notice::Tag ${TAG} already exists on origin — earlier run beat us to it; skipping release"
              RELEASE=false
            fi
          fi

          echo "release=${RELEASE}"          >> "$GITHUB_OUTPUT"
          echo "version=${NEW_VERSION}"      >> "$GITHUB_OUTPUT"
          echo "Releasing as ${NEW_VERSION} (release=${RELEASE}, bumped=${BUMPED}, first_tag=${FIRST_TAG})"

      - name: Update version + CHANGELOG
        if: steps.gate.outputs.release == 'true'
        env:
          NEW_VERSION: ${{ steps.gate.outputs.version }}
          BUMPED:      ${{ steps.bump.outputs.bumped }}
          FIRST_TAG:   ${{ steps.bump.outputs.first_tag }}
        run: |
          set -euo pipefail

          sed -i -E "s/^version: .*/version: \"${NEW_VERSION}\"/" rocrail/config.yaml
          echo "Bumped addon version to: ${NEW_VERSION} (CC bumped=${BUMPED}, first-tag=${FIRST_TAG})"

          if LAST_TAG=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null); then
            git log "${LAST_TAG}..HEAD" --pretty=format:'%s' > /tmp/commit-subjects.txt
          else
            : > /tmp/commit-subjects.txt
          fi
          echo "Commit subjects feeding the changelog entry:"
          cat /tmp/commit-subjects.txt || true

          python3 .github/scripts/prepend-changelog.py \
            --changelog rocrail/CHANGELOG.md \
            --version "${NEW_VERSION}" \
            --commit-subjects-file /tmp/commit-subjects.txt

      - name: Commit, tag & push
        if: steps.gate.outputs.release == 'true'
        env:
          NEW_VERSION: ${{ steps.gate.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add rocrail/config.yaml rocrail/CHANGELOG.md
          if git diff --cached --quiet; then
            echo "No file changes - skipping release commit"
          else
            git commit -m "chore: release ${NEW_VERSION}"
            git push
          fi

          TAG="v${NEW_VERSION}"
          if git rev-parse "${TAG}" >/dev/null 2>&1; then
            echo "::notice::Tag ${TAG} already exists, skipping tag creation"
          else
            git tag -a "${TAG}" -m "Release ${NEW_VERSION}"
            git push origin "${TAG}"
            echo "Planted ${TAG} on $(git rev-parse HEAD)"
          fi

      - name: Create GitHub Release
        if: steps.gate.outputs.release == 'true'
        env:
          GH_TOKEN:    ${{ secrets.GITHUB_TOKEN }}
          NEW_VERSION: ${{ steps.gate.outputs.version }}
        run: |
          set -euo pipefail
          git fetch --quiet origin
          git checkout --quiet origin/main -- rocrail/CHANGELOG.md

          awk -v ver="${NEW_VERSION}" '
            $0 ~ "^## Version " ver "( |$)"                                  { found=1 }
            found && /^## Version / && $0 !~ "^## Version " ver "( |$)"      { exit }
            found                                                             { print }
          ' rocrail/CHANGELOG.md > /tmp/release-notes.md

          if [ ! -s /tmp/release-notes.md ]; then
            echo "::warning::Could not extract changelog section for ${NEW_VERSION}; skipping release create"
            exit 0
          fi

          TAG="v${NEW_VERSION}"
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "::notice::Release ${TAG} already exists, skipping"
          else
            gh release create "${TAG}" \
              --title "${TAG}" \
              --notes-file /tmp/release-notes.md
            echo "Created GitHub Release ${TAG}"
          fi

      - name: Prune obsolete patch tags (after minor/major bump)
        if: steps.gate.outputs.release == 'true' && steps.bump.outputs.bumped == 'true'
        env:
          GH_TOKEN:    ${{ secrets.GITHUB_TOKEN }}
          NEW_VERSION: ${{ steps.gate.outputs.version }}
        run: |
          set -euo pipefail
          PATCH=$(echo "${NEW_VERSION}" | cut -d. -f3)
          if [ "${PATCH}" != "0" ]; then
            echo "::notice::New version ${NEW_VERSION} is a patch bump; not pruning."
            exit 0
          fi
          git fetch --tags --prune --prune-tags --quiet
          # GHCR-package args kept for backwards compatibility with the
          # legacy script signature: those packages still hold the old
          # v1.x image tags and we want them tidied alongside the git
          # tags. Once they are gone, drop these args.
          python3 .github/scripts/prune-old-patches.py \
            --new-version "${NEW_VERSION}" \
            --owner "${{ github.repository_owner }}" \
            --package-amd64 "amd64-addon-${{ env.ADDON_SLUG }}" \
            --package-aarch64 "aarch64-addon-${{ env.ADDON_SLUG }}"
